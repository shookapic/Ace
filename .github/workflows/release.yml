name: Release

# Push a version tag (e.g. v0.1.6) to build, sign, and publish a release for
# Windows, Linux, and macOS. Signed installers + a `latest.json` manifest are
# attached automatically so existing installs can auto-update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_target: ""
          - platform: ubuntu-latest
            args: ""
            rust_target: ""
          # One universal DMG (Intel + Apple Silicon) built on the arm64 runner,
          # avoiding the scarce/slow macos-13 Intel runners.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_target: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Tauri's Linux build needs webkit2gtk + a few system libraries.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # Warm cache lives on `main` (Windows only for now); other platforms build
      # cold but in parallel. save-if:false so tag runs never write tag-scoped
      # caches that nothing can reuse.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ace-release
          save-if: false

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ace ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below. Existing installs update themselves automatically. macOS builds are unsigned — right-click the app and choose Open on first run (or run `xattr -cr /Applications/Ace.app`)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
