name: Warm Rust cache

# GitHub Actions caches are ref-scoped: a run can only restore caches from its
# own ref or the default branch. Release builds run on isolated tag refs, so they
# could never reuse each other's caches. This job keeps warm Rust caches on
# `main` (the default branch), one per OS, under the same shared-key the release
# uses, so tagged releases restore them instead of recompiling all dependencies.
#
# Windows + Linux only: macOS runner minutes cost 10x, so warming it on every
# push would burn the Actions budget. macOS release builds stay cold (infrequent).
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package-lock.json"
      - ".github/workflows/warm-cache.yml"

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    concurrency:
      group: warm-cache-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ace-release

      # tauri-build checks the frontend dist exists, so produce it first.
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

      - name: Compile release dependencies
        working-directory: src-tauri
        run: cargo build --release
