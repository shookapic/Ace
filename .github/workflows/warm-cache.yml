name: Warm Rust cache

# GitHub Actions caches are ref-scoped: a run can only restore caches from its
# own ref or the default branch. Release builds run on isolated tag refs, so they
# could never reuse each other's caches. This job keeps warm Rust caches on
# `main` (the default branch), one per OS, under the same shared-key the release
# uses, so tagged releases restore them instead of recompiling all dependencies.
#
# The repo is public, so Actions minutes are free/unlimited on every runner —
# warming all three platforms (incl. the 10x-cost macOS) costs nothing.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package-lock.json"
      - ".github/workflows/warm-cache.yml"

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_targets: ""
            build: cargo build --release
          - platform: ubuntu-latest
            rust_targets: ""
            build: cargo build --release
          # Warm both arches so the universal release build reuses them.
          - platform: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            build: cargo build --release --target aarch64-apple-darwin && cargo build --release --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    concurrency:
      group: warm-cache-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ace-release

      # tauri-build checks the frontend dist exists, so produce it first.
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

      - name: Compile release dependencies
        working-directory: src-tauri
        run: ${{ matrix.build }}
